# WMAMinc Phase 0 Watchdog (Calvin 2026-11-11): every 5 minutes, from outside the database, ask the back office database
# a 1-line question. The health-watch server function emails Calvin (from alerts@) if it does not answer or is very slow —
# at most one email per 30 minutes. If even that server function cannot be reached, this run fails and GitHub emails the owner.
# It sends no data and changes nothing on the website.
name: Database health ping
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask the database if it is answering
        run: |
          curl -sS -f -m 45 -X POST -H "Content-Type: application/json" -d '{"mode":"ping"}' \
            https://eyryqzlxnsvhhjwutqpd.supabase.co/functions/v1/health-watch
