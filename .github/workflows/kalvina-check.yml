# kalvina's checks on her own work branch (Calvin 2026-11-27): code errors + phone/desktop screenshots.
# Started by kalvina; read-only; nothing here deploys or changes the live site. Protected: kalvina cannot edit .github/.
name: kalvina check
on:
  workflow_dispatch:
    inputs:
      pages: { description: 'pages to screenshot, comma separated', required: false, default: '' }
      work: { description: 'her work branch', required: false, default: '' }
permissions: { contents: read }
concurrency: { group: kalvina-check-${{ github.ref }}, cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Get the browser
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Check and take screenshots
        env: { PAGES: '${{ inputs.pages }}' }
        run: node .github/kalvina/check-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: kalvina-check, path: kalvina-out/, retention-days: 7 }
