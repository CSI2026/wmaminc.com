<script>
// ═══ CALVIN — Calvin Williams' own AI, as its own app (v3456, Calvin 2026-11-25) ═══
// Stand-alone: this page does NOT load the back office. It signs in with the same WMAMinc account and talks to the same
// server brain (AI employee "calvin"), which also works inside WMAMinc and Calvin's other businesses when he switches it on.
var SUPA_URL = 'https://eyryqzlxnsvhhjwutqpd.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cnlxemx4bnN2aGhqd3V0cXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyOTAxNzksImV4cCI6MjA5MTg2NjE3OX0.mZaJzmPJVsZhI2KkUMpFeOun_9w3d2Qfke0VJnMBZaE';
var EMP = 'calvin';
var supaClient = supabase.createClient(SUPA_URL, SUPA_KEY);
var DB = { current:null };
var S = { threads:[], thread:null, msgs:[], files:{}, appr:{}, sugg:{}, lw:{}, waiting:false, sending:false, attach:[], err:'', side:false, poll:null, voice:null, loginErr:'', booting:true };
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
var _aitEsc = esc;
function toast(t){ try{ var d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;z-index:100001'; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1800); }catch(e){} }
var _aitToast = toast;
function loginEmail(u){ u = String(u || '').trim().toLowerCase(); return u ? u.replace(/[^a-z0-9._-]/g, '_') + '@login.wmaminc.com' : ''; }
async function invoke(name, body){
  var ses = await supaClient.auth.getSession(); var tok = ses && ses.data && ses.data.session && ses.data.session.access_token;
  var r = await fetch(SUPA_URL + '/functions/v1/' + name, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPA_KEY, Authorization:'Bearer ' + (tok || SUPA_KEY) }, body:JSON.stringify(body || {}) });
  var d = null; try{ d = await r.json(); }catch(e){}
  return r.ok ? { data:d, error:null } : { data:d, error:{ message:(d && d.error) || ('Server returned ' + r.status) } };
}
function nudge(){ invoke('wmam-ai-worker', {}).catch(function(){}); }

// ── sign in ──
async function boot(){
  var ses = await supaClient.auth.getSession();
  if(ses && ses.data && ses.data.session){ await afterLogin(); } else { S.booting = false; render(); }
}
async function doLogin(){
  var u = $('lgU').value, p = $('lgP').value; S.loginErr = '';
  if(!u || !p){ S.loginErr = 'Type your username and password.'; render(); return; }
  $('lgBtn').disabled = true;
  var r = await supaClient.auth.signInWithPassword({ email:loginEmail(u), password:p });
  if(r.error){ S.loginErr = 'That username or password did not work.'; render(); return; }
  await afterLogin();
}
async function afterLogin(){
  var ses = await supaClient.auth.getSession(); var uid = ses.data.session.user.id;
  var me = (await supaClient.from('agents').select('id,name,role,active').eq('auth_user_id', uid).maybeSingle()).data;
  if(!me || !(Number(me.id) === 1 || String(me.role || '').toLowerCase() === 'owner')){ await supaClient.auth.signOut(); S.booting = false; S.loginErr = 'Calvin is only for Calvin.'; render(); return; }
  DB.current = me; S.booting = false;
  await loadThreads();
  if(S.threads.length && Date.now() - Date.parse(S.threads[0].updated_at) < 6 * 3600000) S.thread = S.threads[0].id;
  if(S.thread) await loadMsgs();
  render(); prepVoice();
}
async function logout(){ endVoice(); await supaClient.auth.signOut(); location.reload(); }

// ── conversations ──
async function loadThreads(){
  var r = await supaClient.from('wmam_ai_threads').select('id,title,updated_at').eq('employee_id', EMP).eq('agent_id', DB.current.id).order('updated_at', { ascending:false }).limit(200);
  S.threads = (r && r.data) || [];
}
async function loadMsgs(){
  if(!S.thread){ S.msgs = []; return; }
  var r = await supaClient.from('wmam_ai_messages').select('id,role,content,task_id,approval_id,suggestion_id,created_at').eq('thread_id', S.thread).order('id', { ascending:false }).limit(300);
  S.msgs = ((r && r.data) || []).slice().reverse();
  var ap = S.msgs.filter(function(m){ return m.approval_id; }).map(function(m){ return m.approval_id; });
  if(ap.length){ var a = await supaClient.from('wmam_ai_approvals').select('id,status').in('id', ap); ((a && a.data) || []).forEach(function(x){ S.appr[x.id] = x.status; }); }
  var sg = S.msgs.filter(function(m){ return m.suggestion_id; }).map(function(m){ return m.suggestion_id; });
  if(sg.length){ var s = await supaClient.from('wmam_ai_suggestions').select('id,status').in('id', sg); ((s && s.data) || []).forEach(function(x){ S.sugg[x.id] = x.status; }); }
  var fids = []; S.msgs.forEach(function(m){ String(m.content || '').replace(/\[file #(\d+)/g, function(_, x){ if(!S.files[x]) fids.push(Number(x)); }); });
  if(fids.length) await loadFiles(fids);
  var lids = []; S.msgs.forEach(function(m){ var x = String(m.content || '').match(/^🔐 \[login #(\d+)/); if(x) lids.push(Number(x[1])); });
  if(lids.length){ var lw = await supaClient.from('wmam_ai_login_waits').select('id,status,site,need').in('id', lids); ((lw && lw.data) || []).forEach(function(x){ S.lw[x.id] = x; }); }
  var last = S.msgs[S.msgs.length - 1];
  S.waiting = !!(last && last.role === 'user') && !(S.stoppedAt && Date.now() - S.stoppedAt < 180000);   // v3520: after Stop she is not 'working' just because your message is last
  if(!S.waiting){ var q = await supaClient.from('wmam_ai_tasks').select('id').eq('thread_id', S.thread).in('status', ['queued', 'running']).limit(1); if(q && q.data && q.data.length) S.waiting = true; }
  if(S.waiting) startPoll(); else stopPoll();
}
async function loadFiles(ids){
  var r = await supaClient.from('wmam_ai_files').select('id,path,name,mime').in('id', ids);
  for(var f of ((r && r.data) || [])){ var u = await supaClient.storage.from('ai-files').createSignedUrl(f.path, 6 * 3600); S.files[f.id] = { name:f.name, mime:f.mime || '', url:u && u.data && u.data.signedUrl }; }
}
function startPoll(){ if(S.poll) return; var n = 0; S.poll = setInterval(async function(){ n++; if(n > 48 && n % 4){ return; } if(S.stream) return; var before = S.msgs.length + ':' + S.waiting; await loadMsgs(); if(before !== S.msgs.length + ':' + S.waiting) render(); }, 2500); }
function stopPoll(){ clearInterval(S.poll); S.poll = null; }
async function openThread(id){ S.thread = id; S.side = false; S.msgs = []; render(); await loadMsgs(); render(); }
function newChat(){ S.thread = null; S.msgs = []; S.side = false; S.waiting = false; stopPoll(); render(); focusBox(); }

// ── sending ──
async function submit(text){
  var r = await supaClient.rpc('wmam_ai_send', { p_employee:EMP, p_thread:S.thread, p_text:text });
  if(r.error) throw new Error(r.error.message);
  var d = r.data; if(typeof d === 'string'){ try{ d = JSON.parse(d); }catch(e){} }
  if(d && d.thread_id && d.thread_id !== S.thread){ S.thread = d.thread_id; loadThreads().then(render); }
